# Your GitHub workflow file under .github/workflows/
# Build the docs on every pull request into master (check only).
# Publish them to GitHub Pages on push to master and on manual runs.
name: build and publish docs
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.x
          11.x

    - run: dotnet tool update -g docfx
    - run: docfx ./docfx_project/docfx.json

    # Pull requests only check that the docs build. They never upload or deploy.
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        # Upload the generated site
        path: './docfx_project/_site'

  deploy-docs:
    if: github.event_name != 'pull_request'
    needs: build-docs
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      actions: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # The group is on this job only, so a pull request check never replaces a queued deployment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
